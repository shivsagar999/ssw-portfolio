<section class="py-20">
    <div class="container mx-auto px-6">
      <h2 class="text-3xl font-bold text-center mb-16">Get in Touch</h2>
      <div class="max-w-xl mx-auto">
        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <div>
            <label class="block text-gray-600 mb-2" for="name">Name</label>
            <input
              type="text"
              id="name"
              formControlName="name"
              class="w-full px-4 py-2 border border-gray-200 rounded focus:outline-none focus:border-primary"
              required
            />
          </div>
          <div>
            <label class="block text-gray-600 mb-2" for="email">Email</label>
            <input
              type="email"
              id="email"
              formControlName="email"
              class="w-full px-4 py-2 border border-gray-200 rounded focus:outline-none focus:border-primary"
              required
            />
          </div>
          <div>
            <label class="block text-gray-600 mb-2" for="message">Message</label>
            <textarea
              id="message"
              rows="4"
              formControlName="message"
              class="w-full px-4 py-2 border border-gray-200 rounded focus:outline-none focus:border-primary"
              required
            ></textarea>
          </div>
          <button
            type="submit"
            class="w-full bg-primary text-white px-6 py-3 !rounded-button hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="contactForm.invalid"
          >
            Send Message
          </button>
        </form>
      </div>
    </div>
  </section>
