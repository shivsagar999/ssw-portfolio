<section class="py-20 bg-gray-50">
  <div class="container mx-auto px-6">
    <h2 class="text-3xl font-bold text-center mb-12">Skills</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-8 text-center">
      <div
        *ngFor="let skill of skills"
        class="bg-white rounded-2xl p-6 shadow hover:shadow-lg transition duration-300"
      >
        <div class="flex justify-center mb-4">
          <img [src]="skill.icon" [alt]="skill.name" class="w-12 h-12" />
        </div>
        <h3 class="text-lg font-semibold text-gray-800">{{ skill.name }}</h3>
      </div>
    </div>
  </div>
</section>
